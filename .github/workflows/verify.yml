name: Verify Neon
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:native
      - run: pnpm build
      - run: git diff --exit-code -- dist/wallet.bundle.js
      - run: pnpm audit --prod
      - name: Exercise deployed contracts in disposable Ethereum forks
        if: github.ref == 'refs/heads/main'
        run: node --test tests/fork.integration.mjs tests/orders.fork.integration.mjs
        timeout-minutes: 5
      - name: Verify current mainnet configuration without signing
        if: github.ref == 'refs/heads/main'
        run: pnpm check:mainnet
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: mainnet-readiness
          path: validation/mainnet-readiness.json

